[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "readlist"
version = "0.1.0"
description = "Keep a reading list in git; fetch the open-access PDFs locally, annotation-safe."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["reading list", "papers", "arxiv", "unpaywall", "bibtex", "open access"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
readlist = "readlist.cli:main"

[project.urls]
Homepage = "https://github.com/biecho/readlist"

[tool.pytest.ini_options]
testpaths = ["tests"]
